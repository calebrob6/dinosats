name: Deploy webapp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bundles OpenLayers/geotiff/proj4 and copies onnxruntime-web and coi-serviceworker into web/
      - name: Build
        run: npm ci && npm run build
      # The data and text encoder are served from Source Cooperative (absolute URLs in web/config.json)
      - name: Assemble site
        run: cp -r web _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
